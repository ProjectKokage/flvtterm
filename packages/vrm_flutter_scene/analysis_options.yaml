analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:lints/recommended.yaml

linter:
  rules:
    - public_member_api_docs
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - no_adjacent_strings_in_list
    - only_throw_errors
    - throw_in_finally
    - unawaited_futures
